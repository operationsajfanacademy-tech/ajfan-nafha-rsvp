<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RSVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<script>
/* ============================================================
   EDIT YOUR DETAILS HERE — everything on the page comes from this
   ============================================================ */
const WEDDING = {
  partnerOne: "Ajfan",
  partnerTwo: "Nafha",
  date: "Wednesday, 23 December 2026",
  time: "",  // e.g. "Ceremony at 4:00 pm" — leave empty to hide
  venue: "Fiftykay Orchids at the Edge",
  address: "Water's Edge, Sri Lanka",
  rsvpBy: "20 October 2026",
  // From Supabase: Project Settings > API Keys (and the Project URL on the project's home page)
  supabaseUrl: "https://pvmbewwtdxuffigjfihy.supabase.co",
  supabaseKey: "sb_publishable_mnWtmUOfeawf16A57ssfgw_15ZiVneX",
  maxPax: 6
};
</script>
<style>
  :root {
    /* Drawn from your flower board */
    --wine: #5E1A2C; --berry: #7E1E2E; --moss: #4E6F2E; --lime: #BCD46C;
    --sage: #CFDBA0; --ink: #2B2A1E;
    --bg: #EFEDE6; --paper: #FAF9F5; --line: #DAD8CC;
    --muted: #5E6248; --olive: #4E6F2E; --danger: #7E1E2E;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { overflow-x: clip; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.6 "Karla", "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px 64px; }

  /* Hero: arched window framing the names */
  .arch {
    z-index: 1;
    background:
      linear-gradient(115deg, transparent 30%, rgba(255,255,255,.07) 45%, transparent 60%),
      linear-gradient(160deg, #6A2033, var(--wine) 55%, #4C1423);
    color: var(--paper);
    border-radius: 280px 280px 8px 8px;
    padding: 72px 28px 40px; text-align: center; position: relative;
  }
  .arch::after {
    content: ""; position: absolute; inset: 10px;
    border: 1px solid rgba(247,248,244,.35);
    border-radius: 270px 270px 4px 4px; pointer-events: none;
  }
  .hero { position: relative; }
  .names {
    font-family: "Gloock", Georgia, serif; font-weight: 400;
    font-size: clamp(2.6rem, 11vw, 4rem); line-height: 1.02; margin: 0;
  }
  .names .and { display: block; font-size: .45em; color: #FFFFFF; margin: 6px 0; }
  .when { margin: 28px 0 4px; font-size: 1.05rem; }
  .where { margin: 0; opacity: .85; font-size: .95rem; }

  .hero + .card { margin-top: 16px; }
  .card {
    background: var(--paper); border-radius: 8px; padding: 32px 24px;
    margin-top: 16px; border: 1px solid var(--line); position: relative;
  }
  h2 { color: var(--wine); font-family: "Gloock", Georgia, serif; font-weight: 400; font-size: 1.7rem; margin: 0 0 4px; }
  .lede { color: var(--muted); margin: 0 0 24px; }

  .field { margin-bottom: 20px; }
  label, .legend { display: block; font-weight: 700; font-size: .95rem; margin-bottom: 6px; }
  .hint { font-weight: 400; color: var(--muted); }
  input[type=text], input[type=tel], select, textarea {
    width: 100%; font: inherit; color: var(--ink); background: #fff;
    border: 1px solid var(--line); border-radius: 6px; padding: 11px 12px;
  }
  textarea { min-height: 90px; resize: vertical; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 3px solid var(--moss); outline-offset: 2px;
  }
  fieldset { border: 0; padding: 0; margin: 0 0 20px; }

  .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice input { position: absolute; opacity: 0; }
  .choice label {
    margin: 0; font-weight: 500; text-align: center; cursor: pointer;
    border: 1px solid var(--line); border-radius: 6px; padding: 14px 8px; background: #fff;
  }
  .choice input:checked + label { background: var(--olive); border-color: var(--olive); color: var(--paper); }
  .choice input:focus-visible + label { outline: 3px solid var(--moss); outline-offset: 2px; }


  .choice.three { grid-template-columns: repeat(3, 1fr); }
  .family-size { margin-top: 16px; }
  .attendees { margin-top: 16px; padding: 16px; background: #fff; border: 1px solid var(--line); border-radius: 6px; }
  .att-row { display: grid; grid-template-columns: 1fr 104px; gap: 8px; margin-top: 8px; }
  .att-row:first-of-type { margin-top: 0; }
  .att-row input, .att-row select { background: var(--paper); }
  [hidden] { display: none !important; }
  button {
    width: 100%; font: inherit; font-weight: 700; cursor: pointer;
    background: var(--berry); color: var(--paper); border: 0; border-radius: 6px; padding: 15px;
  }
  button:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--danger); font-size: .95rem; margin: 12px 0 0; }
  .done { text-align: center; }
  .done h2 { font-size: 2rem; }
  .foot { text-align: center; color: var(--muted); font-size: .9rem; margin-top: 24px; }
  @media (prefers-reduced-motion: no-preference) {
    .done { animation: rise .5s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  }
</style>
</head>
<body>
<main class="wrap">
  <div class="hero">
  <header class="arch">
    <h1 class="names"><span id="p1"></span><span class="and">&amp;</span><span id="p2"></span></h1>
    <p class="when"><span id="date"></span><span id="timeWrap"><br><span id="time"></span></span></p>
    <p class="where"><span id="venue"></span><br><span id="address"></span></p>
  </header>
  </div>

  <section class="card" id="formCard">
    <h2>Will you join us?</h2>
    <p class="lede">Please reply by <span id="rsvpBy"></span>.</p>

    <form id="rsvp" novalidate>
      <div class="field">
        <label for="name">Your full name</label>
        <input type="text" id="name" name="name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="whatsapp">WhatsApp number <span class="hint">(with country code, for updates)</span></label>
        <input type="tel" id="whatsapp" name="whatsapp" autocomplete="tel" inputmode="tel" placeholder="e.g. +94 77 123 4567" required>
      </div>

      <fieldset>
        <span class="legend" id="attendLabel">Can you make it?</span>
        <div class="choice" role="radiogroup" aria-labelledby="attendLabel">
          <input type="radio" id="yes" name="attending" value="Yes"><label for="yes">Joyfully accepts</label>
          <input type="radio" id="no" name="attending" value="No"><label for="no">Regretfully declines</label>
        </div>
      </fieldset>

      <div class="field" id="paxField">
        <span class="legend" id="partyLabel">Who are you replying for?</span>
        <div class="choice three" role="radiogroup" aria-labelledby="partyLabel">
          <input type="radio" id="ptMe" name="party_type" value="Just me"><label for="ptMe">Just me</label>
          <input type="radio" id="ptCouple" name="party_type" value="Couple"><label for="ptCouple">As a couple</label>
          <input type="radio" id="ptFamily" name="party_type" value="Family"><label for="ptFamily">My family</label>
        </div>
        <input type="hidden" id="pax" name="pax">
        <div id="familySize" class="family-size" hidden>
          <label for="familyPax">How many in your family, including you?</label>
          <select id="familyPax"></select>
        </div>
        <div id="attendees" class="attendees" hidden>
          <span class="legend">Names of everyone attending</span>
          <div id="attendeeRows"></div>
        </div>
      </div>

      <button type="submit" id="submitBtn">Send RSVP</button>
      <p class="error" id="error" role="alert" hidden></p>
    </form>
  </section>

  <section class="card done" id="doneCard" hidden aria-live="polite">
    <h2 id="doneTitle"></h2>
    <p class="lede" id="doneText"></p>
  </section>

  <p class="foot">Questions? Just reach out to <span id="footNames"></span>.</p>
</main>

<script>
  const $ = id => document.getElementById(id);
  const W = WEDDING;
  $("p1").textContent = W.partnerOne; $("p2").textContent = W.partnerTwo;
  $("date").textContent = W.date; $("time").textContent = W.time;
  $("venue").textContent = W.venue; $("address").textContent = W.address;
  $("rsvpBy").textContent = W.rsvpBy;
  $("footNames").textContent = `${W.partnerOne} or ${W.partnerTwo}`;
  document.title = `RSVP · ${W.partnerOne} & ${W.partnerTwo}`;
  if (!W.time) $("timeWrap").remove();

  for (let i = 3; i <= W.maxPax; i++) $("familyPax").add(new Option(`${i} people`, i));

  function partyType() { return document.querySelector("input[name=party_type]:checked")?.value || ""; }
  function paxCount() {
    const t = partyType();
    return t === "Just me" ? 1 : t === "Couple" ? 2 : t === "Family" ? +$("familyPax").value : 0;
  }

  function renderAttendees() {
    const n = paxCount(), box = $("attendeeRows");
    $("pax").value = n || "";
    $("familySize").hidden = partyType() !== "Family";
    $("attendees").hidden = n < 2;
    const kept = [...box.querySelectorAll(".att-row")].map(r => ({
      name: r.querySelector("input").value, type: r.querySelector("select").value, touched: r.querySelector("input").dataset.touched
    }));
    box.innerHTML = "";
    for (let i = 0; i < n; i++) {
      const row = document.createElement("div");
      row.className = "att-row";
      const label = i === 0 ? "You" : `Person ${i + 1}`;
      row.innerHTML = `
        <input type="text" name="attendee_${i+1}_name" aria-label="${label}: full name" placeholder="${i === 0 ? "Your name" : "Full name"}">
        <select name="attendee_${i+1}_age" aria-label="${label}: adult or child"><option>Adult</option><option>Child</option></select>`;
      box.append(row);
      const input = row.querySelector("input");
      if (kept[i]) { input.value = kept[i].name; row.querySelector("select").value = kept[i].type; if (kept[i].touched) input.dataset.touched = "1"; }
      else if (i === 0) input.value = $("name").value;
      input.addEventListener("input", () => input.dataset.touched = "1");
    }
  }
  renderAttendees();
  $("familyPax").addEventListener("change", renderAttendees);
  document.querySelectorAll("input[name=party_type]").forEach(r => r.addEventListener("change", renderAttendees));
  $("name").addEventListener("input", () => {
    const first = $("attendeeRows").querySelector("input");
    if (first && !first.dataset.touched) first.value = $("name").value;
  });

  document.querySelectorAll("input[name=attending]").forEach(r => r.addEventListener("change", () => {
    const yes = $("yes").checked;
    $("paxField").hidden = !yes;
  }));

  function showError(msg) { $("error").textContent = msg; $("error").hidden = false; }

  $("rsvp").addEventListener("submit", async e => {
    e.preventDefault();
    $("error").hidden = true;
    const name = $("name").value.trim(), phone = $("whatsapp").value.trim();
    const attending = document.querySelector("input[name=attending]:checked");
    if (!name) return showError("Add your name so we know who's replying."), $("name").focus();
    if (phone.replace(/\D/g, "").length < 7 || !/^\+?[\d\s()-]+$/.test(phone)) return showError("Add your WhatsApp number, including the country code."), $("whatsapp").focus();
    if (!attending) return showError("Let us know whether you can make it.");
    if (attending.value === "Yes") {
      if (!partyType()) return showError("Choose who you're replying for: just you, as a couple, or your family.");
      const empty = [...$("attendeeRows").querySelectorAll("input")].findIndex(i => !i.value.trim());
      if (empty > -1) {
        $("attendeeRows").querySelectorAll("input")[empty].focus();
        return showError(empty === 0 ? "Add your own name in the attendee list." : `Add a name for person ${empty + 1}.`);
      }
    }


    const btn = $("submitBtn");
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      const yesReply = attending.value === "Yes";
      const row = {
        name, whatsapp: phone, attending: attending.value,
        party_type: yesReply ? partyType() : null,
        pax: yesReply ? paxCount() : 0,
        attendees: yesReply ? [...$("attendeeRows").querySelectorAll(".att-row")].map(r => ({
          name: r.querySelector("input").value.trim(), age: r.querySelector("select").value
        })) : []
      };
      if (W.supabaseKey.includes("YOUR_")) {
        console.info("Preview mode — add your Supabase URL and key to collect real responses.", row);
      } else {
        const res = await fetch(`${W.supabaseUrl}/rest/v1/rsvps`, {
          method: "POST",
          headers: { "apikey": W.supabaseKey, "Content-Type": "application/json", "Prefer": "return=minimal" },
          body: JSON.stringify(row)
        });
        if (!res.ok) throw new Error(await res.text());
      }
      const yes = attending.value === "Yes";
      $("doneTitle").textContent = yes ? "See you there!" : "You'll be missed";
      $("doneText").textContent = yes
        ? `Thanks, ${name.split(" ")[0]}. We've got your RSVP and can't wait to celebrate with you on ${W.date}.`
        : `Thanks for letting us know, ${name.split(" ")[0]}. We'll be thinking of you.`;
      $("formCard").hidden = true; $("doneCard").hidden = false;
      $("doneCard").scrollIntoView({ behavior: "smooth", block: "start" });
    } catch {
      showError("Your RSVP didn't go through. Check your connection and try again.");
      btn.disabled = false; btn.textContent = "Send RSVP";
    }
  });
</script>
</body>
</html>
